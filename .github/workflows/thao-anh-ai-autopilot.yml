name: THAO ANH AI - Daily Shorts Autopilot

on:
  # 11:30 UTC = 18:30 Vietnam time; target release is 19:30 Vietnam time.
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thao-anh-ai-autopilot
  cancel-in-progress: false

jobs:
  generate-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      AUTO_PUBLISH: "true"
      SCHEDULE_MINUTES_AHEAD: "60"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate, validate, and schedule one Short
        run: python main.py
      - name: Upload production metadata and run summary
        if: always()
        run: |
          {
            echo "## THAO ANH AI autopilot"
            echo "- Run status: ${{ job.status }}"
            echo "- Scheduled execution: daily at 18:30 Vietnam time"
            echo "- Expected release: approximately 19:30 Vietnam time"
            echo "- Check preceding steps for the generated video and YouTube API result."
          } >> "$GITHUB_STEP_SUMMARY"
